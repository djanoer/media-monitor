# Daftar media yang dipantau. Tambah media = tambah blok di bawah ini, tanpa ubah kode.
# type: native = RSS resmi media | gnews = fallback Google News RSS (ikuti redirect ke URL asli)
media:
  - name: tempo
    display: Tempo
    feed: "https://rss.tempo.co/"
    type: native
    active: true
  - name: cnn_indonesia
    display: CNN Indonesia
    feed: "https://www.cnnindonesia.com/rss"
    type: native
    active: true
