# Daftar media yang dipantau. Tambah media = tambah blok di bawah ini, tanpa ubah kode.
# type: native = RSS resmi media | gnews = fallback Google News RSS (ikuti redirect ke URL asli)
media:
  - name: tempo
    display: Tempo
    color: "#FF6B6B"
    feed: "https://rss.tempo.co/"
    type: native
    active: true
  - name: cnn_indonesia
    display: CNN Indonesia
    color: "#FFA94D"
    feed: "https://www.cnnindonesia.com/rss"
    type: native
    active: true
  - name: antara
    display: Antara
    color: "#FFD43B"
    feed: "https://www.antaranews.com/rss/terkini.xml"
    type: native
    active: true
  - name: republika
    display: Republika
    color: "#69DB7C"
    feed: "https://news.google.com/rss/search?q=site:republika.co.id&hl=id&gl=ID&ceid=ID:id"
    type: gnews
    active: true
  - name: bisnis_indonesia
