# Pengaturan umum. Nilai di sini bisa diubah lewat halaman Pengaturan (Fase 4) tanpa edit file.
fetch:
  interval_hours: 1
  delay_between_media_seconds: 3
  timeout_seconds: 20
  user_agent: "MediaMonitor/0.1 (+personal research project)"
  # batasi item per media per siklus (feed diurutkan terbaru dulu).
  # Tanpa batas, feed Google News (100 item) membuat satu siklus terlalu lama
  # karena setiap link harus di-resolve ke URL artikel asli.
  max_articles_per_media: 30

retention:
  retention_days: 30  # dinamis, bisa diubah via UI

clustering:
  embedding_model: "intfloat/multilingual-e5-base"
  window_hours: 24
  min_articles_per_issue: 3

# Verifikasi klaim (Fase B): ekstraksi klaim + dedup semantik.
verification:
  # 0.95 terkalibrasi 6 Okt 2026 pada 11 headline karhutla:
  # duplikat sejati (Kompas vs Detik soal BPGMN) menyatu, sisanya memisah
  # dengan benar. 0.90 terlalu longgar (9 klaim jadi 1 cluster).
  similarity_threshold: 0.95  # cosine >= ini -> satu cluster klaim
  claim_max_sentences: 3      # kalimat kunci maks per artikel (selain judul)
  claim_min_length: 20        # kalimat lebih pendek dari ini diabaikan
  # Koroborasi (Fase C): skor = min(100, 100 * total_bobot_media_unik / 2.0).
  # 2.0 = dua sumber Tier 1 -> skor 100 ("terkoroborasi").
  tier_weights: {1: 1.0, 2: 0.7, 3: 0.4}  # perlu validasi Bor
  ambang_terkoroborasi: 80
  ambang_satu_sumber: 50
  # headline bombastis -> flag bila mengandung salah satu penanda ini
  penanda_bombastis:
    - darurat
    - gempar
    - heboh
    - viral
    - mengejutkan
    - skandal
    - terbongkar
    - ngeri
    - "!"

# Respon publik (Fase D, pilot karhutla): YouTube Data API + Google Trends.
respon_publik:
  youtube_api_key_env: "YOUTUBE_API_KEY"  # dari environment, JANGAN di config
  youtube_max_videos: 20
  youtube_region: "ID"
  trends_geo: "ID"
  trends_timeframe: "today 1-m"  # 1 bulan terakhir
  trends_keywords: 3             # ambil N high_precision teratas sbg keyword
  trends_jeda_detik: 12          # jeda antar query Trends (anti rate-limit)
  trends_maks_coba: 3            # retry dgn backoff 60/120/240 dtk bila 429
  topik_otomatis: 3              # N topik terhangat dari 24 jam terakhir
  topik_manual: []               # kosong = full otomatis 24 jam (karhutla: arsip)
  topik_maks_total: 5            # batas total topik per jalan
  jadwal: "07:00, 19:00"         # WITA, 2x sehari (scheduler laptop Bor)

# Analisa sentimen + risiko per artikel (Fase F).
analisa:
  ambang_sentimen: 2.0   # |skor| >= ini -> positif/negatif, else netral
  bobot_judul: 2.0       # kata di judul dihitung ganda vs isi
  risiko_base: 20
  risiko_negatif: 35      # sentimen negatif -> +
  risiko_netral: 10
  risiko_bombastis: 20    # headline bombastis -> +
  risiko_belum_terverifikasi: 15   # klaim tak terverifikasi -> +
  risiko_terkoroborasi: -15        # klaim terkoroborasi -> -
  ambang_risiko_tinggi: 65
  ambang_risiko_sedang: 35

storage:
  db_path: "data/media_monitor.db"

# Unduh isi lengkap artikel (Fase H): agar ringkasan dashboard bukan
# sekadar judul. Dijalankan otomatis di akhir tiap siklus fetch.
unduh_isi:
  aktif: true
  limit_per_siklus: 150   # artikel terbaru tanpa isi per siklus
  delay_detik: 1.0        # jeda antar request (sopan ke server media)
  timeout_detik: 20
